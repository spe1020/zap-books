name: CI

on:
  push:
    branches: [business-finance-mvp]
  pull_request:

# Nothing here writes to the repository, so the token can only read it.
permissions:
  contents: read

# Actions are pinned to full commit SHAs, with the release in a comment: a
# tag can be moved to other code, a commit can't. Images are pinned too, so a
# runner or Postgres update can't change a run without a commit.
jobs:
  checks:
    runs-on: ubuntu-24.04
    # The ledger service's tests each create and drop their own database.
    services:
      postgres:
        image: postgres:16.15@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: npm ci

      # The extractor's PDF tests use Poppler (pdftotext, pdftoppm). No
      # model runs in CI; the tests use a fake Ollama server.
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: cargo fmt --check
        run: cargo fmt --check

      # --locked: fail if Cargo.lock doesn't match the manifests, rather than
      # test a dependency set nobody reviewed.
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: npm test
        run: npm test

      - name: npm run build
        run: npm run build

      - name: npm run format:check
        run: npm run format:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: npm run test:e2e
        run: npm run test:e2e

      - name: Parity fixtures match the TypeScript
        run: |
          npm run parity:fixtures
          if [ -n "$(git status --porcelain -- fixtures/parity)" ]; then
            echo "::error::fixtures/parity is out of date. Run 'npm run parity:fixtures' and commit the result."
            git status --short -- fixtures/parity
            git diff --stat -- fixtures/parity
            exit 1
          fi
