[package]
name = "extractor"
version = "0.1.0"
description = "Local receipt extraction service for Zap Books (Ollama, 127.0.0.1 only)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
ledger-core = { path = "../ledger-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "time", "fs"] }
tower-http = { version = "0.7.1", features = ["cors", "limit"] }
tracing = "0.1.44"
