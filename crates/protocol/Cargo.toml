[package]
name = "protocol"
version = "0.1.0"
description = "Zap Books ledger protocol: Nostr event types, epoch encryption, chain verification and membership rules."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hex = "0.4"
ledger-core = { path = "../ledger-core" }
nostr = { version = "0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
