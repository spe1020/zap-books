[package]
name = "protocol-wasm"
version = "0.1.0"
description = "WebAssembly bindings over crates/protocol for the Zap Books browser app."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-pack; rlib so the native parity test can call the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
ledger-core = { path = "../ledger-core" }
nostr = { version = "0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand (through protocol and nostr) reads the operating system's random source
# with getrandom; in a browser that is crypto.getRandomValues.
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2.129"

[dev-dependencies]
hex = "0.4"
